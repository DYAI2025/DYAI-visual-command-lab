name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require lockfile
        run: test -f package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Runtime smoke positive control (test-only approval overlay on exported HEAD, stub provider)
        run: npm run smoke:positive-control
